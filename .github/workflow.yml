name: BARBER SHOP API CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'
  pull_request:
      branches:
        - main


jobs:
    test-and-build:
        name: Build and test API
        runs-on: ubuntu-latest


        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'

            - name: Install dependecies
              run: npm ci

          # - name: Run Unit tests
          #   run: npm run test
          #   env:
          #   NODE_ENV: test

            - name: Build Nest project
              run: npm run build